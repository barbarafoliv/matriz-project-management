spring:
  application:
    name: matriz-backend
  config:
    # Local settings from the repository's .env file (see .env.example), whether the
    # backend is started from backend/ or from the repository root.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/matriz}
    username: ${DB_USERNAME:matriz}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Liquibase; Hibernate only checks it.
      ddl-auto: validate
  autoconfigure:
    # Sign-in is handled by the accounts module, so Spring's default in-memory user isn't needed.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  session:
    # Inactive sessions expire after 30 minutes (NFR-02).
    timeout: 30m
    jdbc:
      # The session tables are created by Liquibase (002-spring-session.sql).
      initialize-schema: never
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # "demo" loads the demo accounts and projects (runs once).
    contexts: ${LIQUIBASE_CONTEXTS:demo}

server:
  servlet:
    context-path: /api
    session:
      cookie:
        # SESSION cookie: not readable by scripts, not sent on cross-site requests (ADR 0004).
        # Not "secure" because the application runs locally without HTTPS (ADR 0006).
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
