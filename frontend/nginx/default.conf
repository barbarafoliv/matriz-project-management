# Serves the Angular app and forwards /api to the backend container (service "backend").
server {
    listen 8080;
    root /usr/share/nginx/html;

    # REST API: same path on the backend (context path /api).
    location /api/ {
        proxy_pass http://backend:8080;
    }

    # Angular routes: unknown paths load the app, so a reload on /projects/1 works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
