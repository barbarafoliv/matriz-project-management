# Matriz CI (ADR 0007): tests, static analysis and builds on every push and pull request.
# The Docker images are built only after all checks pass, and aren't published.
name: CI

on:
  push:
  pull_request:

# Read-only: the workflow only checks out the code. No secrets are used.
permissions:
  contents: read

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and SpotBugs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit and integration tests; Testcontainers uses the runner's Docker.
      - run: ./mvnw -B verify
      - run: ./mvnw -B spotbugs:check

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm as declared in package.json ("packageManager"): newer npm rejects the lock file.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run lint
      - run: npx ng test --watch=false
      - run: npx ng build

  e2e:
    name: End-to-end test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The E2E database and backend read .env; the example has fake values only.
      - run: cp ../.env.example ../.env
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Fake demo password, also written in the README (seeded demo accounts).
      - run: npm run e2e
        env:
          E2E_PASSWORD: matriz-demo-2026
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  docker:
    name: Docker images
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Compose reads .env for its settings; the example has fake values only.
      - run: cp .env.example .env
      - run: docker compose build
