<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matriz – Interface Prototype</title>
  <style>
    :root {
      --bg: #f4f4f4; --surface: #fff; --border: #e0e0e0; --border-strong: #bbb;
      --text: #1a1a1a; --muted: #666; --accent: #2c2c2c; --radius: 4px;
      --shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.5; background: var(--bg); color: var(--text); }
    button { cursor: pointer; font: inherit; }
    a { color: inherit; }

    /* skip link */
    .skip { position: absolute; top: -40px; left: 0; background: var(--accent); color: #fff; padding: 8px 14px; border-radius: 0 0 4px 0; z-index: 200; }
    .skip:focus { top: 0; }

    .proto-bar { background: #222; color: #ccc; padding: 6px 12px; font-size: 11px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .proto-bar strong { color: #fff; margin-right: 4px; }
    .proto-bar button { background: none; border: 1px solid #555; border-radius: 3px; color: #ccc; font-size: 11px; padding: 2px 8px; }
    .proto-bar button:hover { background: #444; }
    .mock-notice { background: #fffbea; border-bottom: 1px solid #e8d880; padding: 5px 12px; font-size: 11px; color: #554400; text-align: center; }

    /* nav */
    .nav { background: var(--surface); border-bottom: 1px solid var(--border); }
    .nav-inner { max-width: 1100px; margin: 0 auto; padding: 0 16px; height: 52px; display: flex; align-items: center; gap: 20px; }
    .nav-logo { font-weight: 700; font-size: 15px; letter-spacing: .07em; text-decoration: none; }
    .nav-link { padding: 5px 9px; border-radius: var(--radius); text-decoration: none; font-size: 13px; color: var(--muted); }
    .nav-link:hover, .nav-link[aria-current] { background: var(--bg); color: var(--text); }
    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .nav-user { font-size: 13px; color: var(--muted); }

    /* main */
    #main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

    /* buttons */
    .btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 13px; border-radius: var(--radius); border: 1.5px solid var(--border-strong); background: var(--surface); font-size: 13px; text-decoration: none; transition: background .12s; }
    .btn:hover { background: var(--bg); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: #444; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-ghost { border-color: transparent; background: transparent; }
    .btn-ghost:hover { background: var(--bg); }
    .btn-danger { color: #900; border-color: #e0b0b0; }
    .btn-danger:hover { background: #fff5f5; }
    .btn-link { border: none; background: none; padding: 0; color: #0055cc; text-decoration: underline; font-size: inherit; }

    /* forms */
    .field { display: flex; flex-direction: column; gap: 4px; }
    .label { font-size: 13px; font-weight: 500; }
    .input { padding: 8px 10px; border: 1.5px solid var(--border-strong); border-radius: var(--radius); font: inherit; font-size: 13px; }
    .input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    .hint { font-size: 12px; color: var(--muted); }
    .err-msg { font-size: 12px; color: #900; }

    /* badges */
    .badge { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; border: 1px solid; }
    .b-late   { background: #e8e8e8; border-color: #888; }
    .b-high   { background: #f5f5f5; border-color: #999; }
    .b-medium { background: #f8f8f8; border-color: #bbb; }
    .b-low    { background: #fafafa; border-color: #ddd; color: #888; }
    .b-todo   { background: #f0f0f0; border-color: #ccc; color: #555; }
    .b-prog   { background: #e8e8e8; border-color: #aaa; }
    .b-done   { background: #f8f8f8; border-color: #ccc; color: #999; }
    .b-pm     { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 10px; }

    /* alerts */
    .alert { padding: 10px 13px; border-radius: var(--radius); border: 1px solid; font-size: 13px; display: flex; gap: 8px; }
    .alert-error { background: #fff5f5; border-color: #f0c0c0; color: #800; }
    .alert-info  { background: #f5f8ff; border-color: #c0d0f0; color: #003; }

    /* page header */
    .ph { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
    .ph h1 { font-size: 20px; font-weight: 700; }
    .ph p  { font-size: 13px; color: var(--muted); margin-top: 2px; }

    /* project grid */
    .proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
    .proj-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit; transition: box-shadow .15s; }
    .proj-card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.12); }
    .proj-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .proj-name { font-weight: 600; font-size: 15px; }
    .proj-desc { font-size: 12px; color: var(--muted); }

    /* board */
    .bc-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .members { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 16px; flex-wrap: wrap; }
    .av { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #ddd; border: 2px solid var(--surface); font-size: 11px; font-weight: 700; box-shadow: 0 0 0 1px #ccc; flex-shrink: 0; }
    .av-pm { background: var(--accent); color: #fff; }
    .board { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding-bottom: 8px; }
    .col { flex: 0 0 255px; background: #efefef; border-radius: var(--radius); border: 1px solid var(--border); }
    .col-hd { padding: 9px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
    .col-ct { background: #ddd; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 400; }
    .col-bd { padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }

    /* task card */
    .tc { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 11px; cursor: pointer; }
    .tc:hover { box-shadow: 0 2px 6px rgba(0,0,0,.1); }
    .tc:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .tc.late { border-left: 3px solid #888; background: #f9f9f9; }
    .tc.highlight { outline: 2px solid var(--accent); background: #fafae8; }
    .tc-title { font-size: 13px; font-weight: 600; margin-bottom: 7px; }
    .tc-foot { display: flex; align-items: center; justify-content: space-between; }
    .tc-meta { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }

    /* my tasks table */
    .tbl { width: 100%; border-collapse: collapse; }
    .tbl th { text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; border-bottom: 2px solid var(--border); white-space: nowrap; }
    .tbl td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl tr.late td:first-child { border-left: 3px solid #888; }
    .tbl tr:hover td { background: var(--bg); cursor: pointer; }

    /* empty / skeleton */
    .empty { text-align: center; padding: 56px 24px; color: var(--muted); }
    .empty-icon { font-size: 36px; margin-bottom: 10px; opacity: .5; }
    .empty h2 { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .empty p  { font-size: 13px; margin-bottom: 18px; }
    .skel { background: linear-gradient(90deg,#e4e4e4 25%,#efefef 50%,#e4e4e4 75%); background-size: 200% 100%; animation: sh 1.5s infinite; border-radius: 3px; }
    @keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* auth */
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); }
    .auth-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 32px; width: 100%; max-width: 370px; }
    .auth-logo { font-size: 22px; font-weight: 700; letter-spacing: .06em; text-align: center; margin-bottom: 6px; }
    .auth-sub  { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 24px; }
    .auth-form { display: flex; flex-direction: column; gap: 14px; }
    .auth-foot { margin-top: 18px; text-align: center; font-size: 13px; color: var(--muted); }

    /* modal */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
    .modal { background: var(--surface); border-radius: var(--radius); box-shadow: 0 8px 32px rgba(0,0,0,.2); width: 100%; max-width: 470px; max-height: 90vh; overflow-y: auto; }
    .modal-hd { display: flex; align-items: center; justify-content: space-between; padding: 15px 18px; border-bottom: 1px solid var(--border); }
    .modal-hd h2 { font-size: 15px; font-weight: 600; }
    .modal-bd { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .modal-ft { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
    .modal-ft-split { justify-content: space-between; }

    /* breadcrumb */
    .bc { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    .bc a { color: var(--muted); text-decoration: none; }
    .bc a:hover { text-decoration: underline; }

    /* two-col grid inside modal */
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    hr { border: none; border-top: 1px solid var(--border); }

    /* card wrapper */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }

    /* status counts (dashboard) */
    .counts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
    .count { font-size: 11px; padding: 2px 7px; border: 1px solid var(--border); border-radius: 3px; background: var(--bg); }
    .count strong { font-size: 12px; }

    /* search and filters */
    .toolbar { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
    .toolbar .field { min-width: 160px; }
    .search { max-width: 360px; flex: 1; }

    /* task detail page */
    .detail { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: flex-start; }
    .panel { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .panel h2 { font-size: 14px; font-weight: 600; }
    .panel-ft { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .assignees { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .assignees li { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .comments { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .comment { border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .comment:last-child { border-bottom: none; }
    .comment-hd { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .comment-hd strong { color: var(--text); font-size: 13px; }
    .comment p { font-size: 13px; white-space: pre-wrap; }

    @media(max-width:600px) {
      .board { flex-direction: column; }
      .col  { flex: none; width: 100%; }
      .grid2 { grid-template-columns: 1fr; }
    }
    @media(max-width:800px) {
      .detail { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<a href="#main" class="skip">Skip to content</a>
<div id="app"></div>

<script>
// ── MOCK DATA ────────────────────────────────────────────────
const MOCK = {
  user: { id: 1, name: 'Alice Ferreira', email: 'alice@example.com' },
  projects: [
    { id: 1, name: 'Q4 Launch',        description: 'All tasks for the Q4 product launch.', member_role: 'PROJECT_MANAGER' },
    { id: 2, name: 'Website Redesign', description: null,                                    member_role: 'MEMBER' },
    { id: 3, name: 'API Integration',  description: 'Connect Matriz with external APIs.',    member_role: 'MEMBER' },
  ],
  members: [
    { id: 1, name: 'Alice Ferreira', email: 'alice@example.com', role: 'PROJECT_MANAGER' },
    { id: 2, name: 'Bob Silva',      email: 'bob@example.com',   role: 'MEMBER' },
    { id: 3, name: 'Carol Santos',   email: 'carol@example.com', role: 'MEMBER' },
    { id: 4, name: 'Dan Costa',      email: 'dan@example.com',   role: 'MEMBER' },
  ],
  tasks: {
    1: [
      { id:1, title:'Set up CI pipeline',     description:'Build and test on every push.', assignees:[2],       due:'2026-10-20', priority:'MEDIUM', status:'TODO',        late:true  },
      { id:2, title:'Write unit tests',       description:null,                            assignees:[],        due:'2026-10-15', priority:'LOW',    status:'TODO',        late:true  },
      { id:3, title:'Fix login redirect',     description:null,                            assignees:[1,2,3,4], due:'2026-11-30', priority:'HIGH',   status:'TODO',        late:false },
      { id:4, title:'Design sign-in screen',  description:'Follow the UI decisions.',      assignees:[3,1],     due:'2026-11-20', priority:'HIGH',   status:'IN_PROGRESS', late:false },
      { id:5, title:'Implement task API',     description:null,                            assignees:[2],       due:'2026-11-18', priority:'MEDIUM', status:'IN_PROGRESS', late:false },
      { id:6, title:'Write requirements doc', description:null,                            assignees:[1],       due:'2026-10-25', priority:'LOW',    status:'DONE',        late:false },
    ],
    2: [
      { id:7, title:'Audit current pages',       description:null, assignees:[1],   due:'2026-11-05', priority:'MEDIUM', status:'DONE',        late:false },
      { id:8, title:'Create new colour palette', description:null, assignees:[1,3], due:'2026-11-12', priority:'LOW',    status:'IN_PROGRESS', late:false },
      { id:9, title:'Update homepage layout',    description:null, assignees:[1],   due:'2026-10-22', priority:'HIGH',   status:'TODO',        late:true  },
    ],
    3: [],
  },
  comments: {
    4: [
      { id:1, author:'Carol Santos',   content:'First draft is in the shared folder.',          createdAt:'2026-10-26T09:14' },
      { id:2, author:null,             content:'Can we keep the logo on the left?',             createdAt:'2026-10-26T11:02' },
      { id:3, author:'Alice Ferreira', content:'Yes, and let\'s check it on narrow screens too.', createdAt:'2026-10-27T15:40' },
    ],
  },
};
const myTasks = () => Object.entries(MOCK.tasks).flatMap(([pid, list]) => {
  const proj = MOCK.projects.find(p => p.id === +pid);
  return list.filter(t => t.assignees.includes(MOCK.user.id)).map(t => ({...t, project_name: proj.name, project_id: +pid}));
});

// ── STATE ────────────────────────────────────────────────────
var S = { screen:'sign-in', params:{}, modal:null, signedIn:false, loading:false, empty:false, error:false, expired:false,
          highlightId:null, confirmPayload:null, q:'', fStatus:'', fPriority:'' };

// ── ROUTER ───────────────────────────────────────────────────
function go(screen, params={}) { S.screen=screen; S.params=params; S.modal=null; if(screen!=='board') S.highlightId=null; render(); scrollTo(0,0); }
function openModal(m)           { S.modal=m; render(); }
function closeModal()           { S.modal=null; render(); }

// ── HELPERS ──────────────────────────────────────────────────
const esc   = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byDue = (a,b) => (a.due||'9999-12-31').localeCompare(b.due||'9999-12-31') || a.id-b.id;
const ini   = n => n ? n.split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase() : '?';
const fmtD  = d => d ? d.split('-').reverse().join('/') : '—';
const fmtDT = d => fmtD(d.slice(0,10)) + ' ' + d.slice(11,16);
const member = id => MOCK.members.find(m => m.id === id);
const pBadge = p => `<span class="badge b-${p.toLowerCase()}">${p[0]+p.slice(1).toLowerCase()}</span>`;
const sBadge = s => { const l={TODO:'To Do',IN_PROGRESS:'In Progress',DONE:'Done'}; const c={TODO:'b-todo',IN_PROGRESS:'b-prog',DONE:'b-done'}; return `<span class="badge ${c[s]}">${l[s]}</span>`; };
const counts = pid => { const t = MOCK.tasks[pid] || []; const n = s => t.filter(x => x.status === s).length; return { todo:n('TODO'), inProgress:n('IN_PROGRESS'), done:n('DONE') }; };
const findTask = (pid, tid) => (MOCK.tasks[pid] || []).find(x => x.id === tid);

// Up to 3 initials, then "+N" (UI decision: assignees added one at a time).
function avatars(ids) {
  if (!ids.length) return `<span class="av" title="Unassigned" aria-label="Unassigned">—</span>`;
  const names = ids.map(id => member(id).name);
  const shown = names.slice(0,3).map(n => `<span class="av" title="${n}" aria-hidden="true">${ini(n)}</span>`).join('');
  const more  = names.length > 3 ? `<span class="av" aria-hidden="true">+${names.length-3}</span>` : '';
  return `<span style="display:inline-flex" aria-label="Assigned to ${names.join(', ')}">${shown}${more}</span>`;
}

function countsHtml(c) {
  return `<div class="counts" aria-label="Tasks per status">
    <span class="count">To Do <strong>${c.todo}</strong></span>
    <span class="count">In Progress <strong>${c.inProgress}</strong></span>
    <span class="count">Done <strong>${c.done}</strong></span>
  </div>`;
}

function emptyState(icon, title, text, action='') {
  return `<div class="empty" role="status"><div class="empty-icon">${icon}</div><h2>${title}</h2><p>${text}</p>${action}</div>`;
}

function errorBanner(what) {
  return `<div class="alert alert-error" role="alert">⚠ Could not load ${what}. <button class="btn-link" onclick="S.error=false;render()">Try again</button></div>`;
}

function projectCard(p) {
  return `<a class="proj-card" href="#" onclick="go('board',{pid:${p.id}});return false"
     aria-label="${p.name}, ${p.member_role==='PROJECT_MANAGER'?'you are project manager':'member'}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <span class="proj-name">${p.name}</span>
      ${p.member_role==='PROJECT_MANAGER'?'<span class="badge b-pm">PM</span>':''}
    </div>
    <p class="proj-desc">${p.description||'<em style="opacity:.5">No description</em>'}</p>
    ${countsHtml(counts(p.id))}
  </a>`;
}

const skelGrid = () => `<div class="proj-grid" aria-busy="true">${[1,2,3].map(()=>`<div class="skel" style="height:140px;border-radius:4px"></div>`).join('')}</div>`;

// ── SCREENS ──────────────────────────────────────────────────

function SignIn() {
  return `<div class="auth-wrap">
    <div class="auth-box">
      <p class="auth-logo">MATRIZ</p>
      <p class="auth-sub">Project and task management for small teams.</p>
      ${S.expired ? `<div class="alert alert-info" role="alert" style="margin-bottom:14px">Your session has expired. Sign in again.</div>` : ''}
      ${S.error ? `<div class="alert alert-error" role="alert" style="margin-bottom:14px"><span aria-hidden="true">⚠ </span>Email or password is incorrect.</div>` : ''}
      <form class="auth-form" onsubmit="S.signedIn=true;S.error=false;S.expired=false;go('dashboard');return false">
        <div class="field"><label class="label" for="si-e">Email</label>
          <input class="input" id="si-e" type="email" value="alice@example.com" required autocomplete="email"/></div>
        <div class="field"><label class="label" for="si-p">Password</label>
          <input class="input" id="si-p" type="password" value="••••••••" required autocomplete="current-password"/></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center">Sign in</button>
      </form>
      <p class="auth-foot">Use one of the demo accounts listed in the README.</p>
    </div>
  </div>`;
}

// Optional extension (FR-18). Only built if public sign-up is added.
function SignUp() {
  return `<div class="auth-wrap">
    <div class="auth-box">
      <p class="auth-logo">MATRIZ</p>
      <p class="auth-sub">Create your account to get started.</p>
      <div class="alert alert-info" role="note" style="margin-bottom:14px">Optional extension (FR-18). Not part of the MVP.</div>
      <form class="auth-form" onsubmit="S.signedIn=true;go('dashboard');return false">
        <div class="field"><label class="label" for="su-n">Name</label>
          <input class="input" id="su-n" type="text" placeholder="Your name" required autocomplete="name"/></div>
        <div class="field"><label class="label" for="su-e">Email</label>
          <input class="input" id="su-e" type="email" placeholder="you@example.com" required autocomplete="email"/></div>
        <div class="field"><label class="label" for="su-p">Password</label>
          <input class="input" id="su-p" type="password" required minlength="8" maxlength="64" autocomplete="new-password" aria-describedby="su-p-hint"/>
          <span class="hint" id="su-p-hint">At least 8 characters.</span></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center">Create account</button>
      </form>
      <p class="auth-foot">Already have an account? <a href="#" onclick="go('sign-in');return false">Sign in</a></p>
    </div>
  </div>`;
}

function Dashboard() {
  let body;
  if (S.loading)      body = skelGrid();
  else if (S.error)   body = errorBanner('your projects');
  else if (S.empty)   body = emptyState('📋', 'No projects yet', 'Create your first project to start organising your team\'s work.',

function Board() {
  const pid   = S.params.pid || 1;
  const proj  = MOCK.projects.find(p=>p.id===pid) || MOCK.projects[0];
  const all   = MOCK.tasks[pid] || [];
  const tasks = all.filter(t => (!S.fStatus || t.status===S.fStatus) && (!S.fPriority || t.priority===S.fPriority));
  const isPM  = proj.member_role === 'PROJECT_MANAGER';
  const cols  = [
    { key:'TODO',        label:'To Do' },
    { key:'IN_PROGRESS', label:'In Progress' },
    { key:'DONE',        label:'Done' },
  ].filter(c => !S.fStatus || c.key===S.fStatus);
  const sel = (id, label, value, opts, set) => `<div class="field"><label class="label" for="${id}">${label}</label>
    <select class="input" id="${id}" onchange="${set}=this.value;render()">
      <option value="">All</option>
      ${opts.map(([v,l])=>`<option value="${v}"${v===value?' selected':''}>${l}</option>`).join('')}
    </select></div>`;

  let boardBody;
  if (S.loading) {
    boardBody = `<div style="display:flex;gap:12px" aria-busy="true">
      ${[1,2,3].map(()=>`<div class="skel" style="flex:0 0 255px;height:280px;border-radius:4px"></div>`).join('')}
    </div>`;
  } else if (S.error) {
    boardBody = errorBanner('tasks');
  } else if (!all.length) {
    boardBody = emptyState('✅', 'No tasks yet', 'Create the first task to get the team started.',
                  `<button class="btn btn-primary" onclick="openModal('new-task')">+ New Task</button>`);
  } else if (!tasks.length) {
    boardBody = emptyState('🔍', 'No tasks match these filters.', 'Change or clear the filters.',
                  `<button class="btn" onclick="S.fStatus='';S.fPriority='';render()">Clear filters</button>`);
  } else {
    boardBody = `<div class="board" role="list" aria-label="Task board">
      ${cols.map(({key,label}) => {
        const col = tasks.filter(t=>t.status===key).sort(byDue);
        return `<section class="col" role="listitem" aria-label="${label}, ${col.length} task${col.length!==1?'s':''}">
          <div class="col-hd">${label}<span class="col-ct" aria-hidden="true">${col.length}</span></div>
          <div class="col-bd">
            ${col.map(t=>`
            <article class="tc${t.late?' late':''}${S.highlightId===t.id?' highlight':''}"
                     id="task-${t.id}" tabindex="0" role="button"
                     aria-label="${t.title}${t.late?', late':''}${S.highlightId===t.id?', highlighted':''}"
                     onclick="go('task',{pid:${pid},tid:${t.id}})"
                     onkeydown="if(event.key==='Enter'){go('task',{pid:${pid},tid:${t.id}})}">
              <div class="tc-title">${t.title}</div>
              <div class="tc-foot">
                <div class="tc-meta">
                  ${avatars(t.assignees)}
                  ${t.due?`<span aria-label="Due ${fmtD(t.due)}">📅 ${fmtD(t.due)}</span>`:''}
                </div>
                <div style="display:flex;gap:4px;align-items:center">
                  ${pBadge(t.priority)}
                  ${t.late?`<span class="badge b-late" aria-label="Late">Late</span>`:''}
                </div>
              </div>
            </article>`).join('')
            || `<p style="font-size:12px;color:#bbb;text-align:center;padding:16px 0" aria-live="polite">No tasks</p>`}
          </div>
        </section>`;
      }).join('')}
    </div>`;
  }

  return `
  <nav class="bc" aria-label="Breadcrumb">
    <a href="#" onclick="go('projects');return false">Projects</a>
    <span aria-hidden="true">›</span>
    <span aria-current="page">${proj.name}</span>
  </nav>
  <div class="bc-row">
    <div>
      <h1 style="font-size:20px;font-weight:700">${proj.name}</h1>
      ${proj.description?`<p style="font-size:13px;color:var(--muted);margin-top:2px">${proj.description}</p>`:''}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${isPM?`<button class="btn btn-sm" onclick="openModal('edit-project')">Edit</button>`:''}
      ${isPM?`<button class="btn btn-sm btn-danger" onclick="openModal('confirm-delete-project')">Delete</button>`:''}
      <button class="btn btn-sm btn-primary" onclick="openModal('new-task')">+ New Task</button>

  </div>
  <div class="members" aria-label="Project members">
    <span style="font-size:12px">Members:</span>
    ${MOCK.members.map(m=>`<span class="av${m.role==='PROJECT_MANAGER'?' av-pm':''}" title="${m.name}${m.role==='PROJECT_MANAGER'?' (PM)':''}" aria-label="${m.name}${m.role==='PROJECT_MANAGER'?', project manager':''}">${ini(m.name)}</span>`).join('')}

// ── MOCK ACTIONS ─────────────────────────────────────────────

function setStatus(pid, tid, s) { const t = findTask(pid, tid); t.status = s; if (s === 'DONE') t.late = false; render(); }
function assign(pid, tid, uid)  { const t = findTask(pid, tid); if (!t.assignees.includes(uid)) t.assignees.push(uid); render(); }
function unassign(pid, tid, uid){ const t = findTask(pid, tid); t.assignees = t.assignees.filter(id => id !== uid); render(); }
function addComment(tid) {
  const el = document.getElementById('tc-c');
  if (!el.value.trim()) { document.getElementById('tc-err').textContent = 'Comment must not be empty.'; return; }
  (MOCK.comments[tid] = MOCK.comments[tid] || []).push({ id: Date.now(), author: MOCK.user.name, content: el.value.trim(), createdAt: '2026-10-28T10:00' });
  render();
}

function render() {
  const SCREENS = { 'sign-in':SignIn, 'sign-up':SignUp, dashboard:Dashboard, projects:Projects, board:Board, task:TaskDetail, 'my-tasks':MyTasks };
  const MODALS  = { 'new-project':NewProjectModal, 'edit-project':EditProjectModal, 'new-task':NewTaskModal, 'manage-members':ManageMembersModal, 'confirm-delete-task':ConfirmDeleteTaskModal, 'confirm-delete-project':ConfirmDeleteProjectModal, 'confirm-remove-member':ConfirmRemoveMemberModal, 'confirm-delete-account':ConfirmDeleteAccountModal };
  const auth    = ['sign-in','sign-up'].includes(S.screen);
  const screenH = (SCREENS[S.screen]||SignIn)();
  const modalH  = S.modal && MODALS[S.modal]
    ? `<div class="overlay" role="dialog" aria-modal="true" onclick="if(event.target===this)closeModal()">
         <div class="modal" onclick="event.stopPropagation()">${MODALS[S.modal]()}</div>
       </div>` : '';
  const navLink = (screen, label, also=[]) => `<a href="#" class="nav-link"${[screen,...also].includes(S.screen)?' aria-current="page"':''}
         onclick="go('${screen}');return false">${label}</a>`;

  const nav = !auth ? `<nav class="nav" aria-label="Main navigation">
    <div class="nav-inner">
      <a href="#" class="nav-logo" onclick="go('dashboard');return false" aria-label="Matriz home">MATRIZ</a>
      ${navLink('dashboard','Dashboard')}
      ${navLink('projects','Projects',['board','task'])}
      ${navLink('my-tasks','My Tasks')}
      <div class="nav-right">
        <span class="nav-user">${MOCK.user.name}</span>
        <button class="btn btn-sm btn-ghost" onclick="openModal('confirm-delete-account')">Delete account</button>
        <button class="btn btn-sm" onclick="S.signedIn=false;go('sign-in')">Sign out</button>
      </div>
    </div>
  </nav>` : '';

  document.getElementById('app').innerHTML = `
    <div class="proto-bar" aria-label="Prototype controls">
      <strong>Screens:</strong>
      <button onclick="go('sign-in')">Sign in</button>
      <button onclick="S.signedIn=true;go('dashboard')">Dashboard</button>
      <button onclick="S.signedIn=true;go('projects')">Projects</button>
      <button onclick="S.signedIn=true;go('board',{pid:1})">Project (PM)</button>
      <button onclick="S.signedIn=true;go('board',{pid:2})">Project (member)</button>
      <button onclick="S.signedIn=true;go('board',{pid:3})">Project (empty)</button>
      <button onclick="S.signedIn=true;go('task',{pid:1,tid:4})">Task detail</button>
      <button onclick="S.signedIn=true;go('my-tasks')">My Tasks</button>
      <button onclick="go('sign-up')">Sign up (optional)</button>
      &nbsp;|&nbsp;<strong>States:</strong>
      <button onclick="S.loading=!S.loading;render()">Toggle loading</button>
      <button onclick="S.error=!S.error;render()">Toggle error</button>
      <button onclick="S.empty=!S.empty;render()">Toggle empty</button>
      <button onclick="S.error=true;go('sign-in')">Sign-in error</button>
      <button onclick="S.error=false;S.expired=true;S.signedIn=false;go('sign-in')">Session expired</button>
      &nbsp;|&nbsp;<strong>Modals:</strong>
      <button onclick="S.signedIn=true;go('projects');openModal('new-project')">New project</button>
      <button onclick="S.signedIn=true;go('board',{pid:1});openModal('new-task')">New task</button>
      <button onclick="S.signedIn=true;go('board',{pid:1});openModal('manage-members')">Members</button>
      <button onclick="S.signedIn=true;go('dashboard');openModal('confirm-delete-account')">Delete account</button>
    </div>
    <div class="mock-notice" role="note">⚠ PROTOTYPE — All data is mock data, not connected to any API.</div>
    ${nav}
    ${auth ? screenH : `<main id="main" tabindex="-1">${screenH}</main>`}
    ${modalH}`;

  if (S.highlightId) {
    const el = document.getElementById('task-' + S.highlightId);
    if (el) setTimeout(() => el.scrollIntoView({ behavior:'smooth', block:'center' }), 50);
  }
}

render();
</script>
</body>
</html>
