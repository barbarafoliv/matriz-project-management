openapi: 3.1.0
info:
  title: Matriz API
  version: 1.0.0
  summary: REST API for managing projects and tasks
  description: |
    Teaching example for Class 02 — Architecture and Prototyping.

    The specification documents resources, JSON contracts, validations,
    authentication and response codes. It **does not implement** the server.

    Business rules assumed for the example:
    - The authenticated user is the owner of the projects they create.
    - Access to projects and their tasks requires authorisation.
    - Tasks belong to a single project and can have several assignees.
    - A task can only be assigned once to each user.
    - Identifiers are positive integers, aligned with the ER model.
  contact:
    name: Matriz Team (academic example)
servers:
  - url: https://api.example.com/v1
    description: Illustrative address — not an active API
  - url: http://localhost:8080/api/v1
    description: Local environment (after implementation)
tags:
  - name: Users
    description: Authenticated user data
  - name: Projects
    description: Project management
  - name: Tasks
    description: Management of a project's tasks
  - name: Comments
    description: Comments on tasks
  - name: Assignments
    description: N:M association between users and tasks
security:
  - bearerAuth: []

paths:
  /users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      operationId: getCurrentUser
      responses:
        '200':
          description: Authenticated user's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 7
                name: Ana Silva
                email: ana.silva@example.org
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects:
    get:
      tags: [Projects]
      summary: List the projects the user can access
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: Filter by project name
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: Matriz
      responses:
        '200':
          description: Paginated list of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      summary: Create a project
      description: The owner is inferred from the authentication token.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
            example:
              name: Matriz
              description: Project and task management platform
      responses:
        '201':
          description: Project created
          headers:
            Location:
              description: Path of the created resource
              schema:
                type: string
              example: /api/v1/projects/12
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example:
                id: 12
                name: Matriz
                description: Project and task management platform
                ownerId: 7
                createdAt: '2026-10-20T10:00:00Z'
                updatedAt: '2026-10-20T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: Get a project
      operationId: getProject
      responses:
        '200':
          description: Project found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projects]
      summary: Partially update a project
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProject'
            example:
              name: Matriz 2.0
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Projects]
      summary: Delete a project
      description: In this example, it also deletes the dependent tasks and comments.
      operationId: deleteProject
      responses:
        '204':
          description: Project deleted, no response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tasks]
      summary: List a project's tasks
      operationId: listProjectTasks
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: Filter by status
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: priority
          in: query
          description: Filter by priority
          schema:
            $ref: '#/components/schemas/TaskPriority'
      responses:
        '200':
          description: Paginated list of tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Tasks]
      summary: Create a task in a project
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTask'
            example:
              title: Create interface prototype
              description: Prepare the application's main screens
              status: TODO
              priority: HIGH
      responses:
        '201':
          description: Task created
          headers:
            Location:
              description: Path of the created resource
              schema:
                type: string
              example: /api/v1/tasks/35
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              example:
                id: 35
                projectId: 12
                title: Create interface prototype
                description: Prepare the application's main screens
                status: TODO
                priority: HIGH
                createdAt: '2026-10-20T10:20:00Z'
                updatedAt: '2026-10-20T10:20:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Get a task
      operationId: getTask
      responses:
        '200':
          description: Task found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tasks]
      summary: Partially update a task
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTask'
            example:
              status: IN_PROGRESS
              priority: MEDIUM
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Tasks]
      summary: Delete a task
      description: Also removes the task's comments and assignments.
      operationId: deleteTask
      responses:
        '204':
          description: Task deleted, no response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{taskId}/comments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Comments]
      summary: List a task's comments
      operationId: listTaskComments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated list of comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Comments]
      summary: Add a comment to a task
      description: The author is identified from the authentication token.
      operationId: createTaskComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComment'
            example:
              content: The initial prototype is ready for review.
      responses:
        '201':
          description: Comment created
          headers:
            Location:
              description: Logical path of the created comment
              schema:
                type: string
              example: /api/v1/tasks/35/comments/88
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
              example:
                id: 88
                taskId: 35
                authorId: 7
                content: The initial prototype is ready for review.
                createdAt: '2026-10-20T11:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /tasks/{taskId}/assignments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Assignments]
      summary: List the users assigned to a task
      operationId: listTaskAssignments
      responses:
        '200':
          description: Task assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAssignmentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{taskId}/assignments/{userId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Assignments]
      summary: Assign a user to a task
      description: |
        Idempotent operation: if the assignment already exists, it is returned without
        creating a duplicate. Only authorised users can manage assignments.
      operationId: assignUserToTask
      responses:
        '200':
          description: Assignment already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAssignment'
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAssignment'
              example:
                taskId: 35
                userId: 9
                assignedAt: '2026-10-20T11:10:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Assignments]
      summary: Remove a user's assignment
      operationId: unassignUserFromTask
      responses:
        '204':
          description: Assignment removed, no response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token sent in the Authorization header

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Project identifier
      schema:
        type: integer
        minimum: 1
      example: 12
    TaskId:
      name: taskId
      in: path
      required: true
      description: Task identifier
      schema:
        type: integer
        minimum: 1
      example: 35
    UserId:
      name: userId
      in: path
      required: true
      description: User identifier
      schema:
        type: integer
        minimum: 1
      example: 9
    Page:
      name: page
      in: query
      required: false
      description: Page to retrieve (starts at 1)
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Maximum number of results per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

  responses:
    BadRequest:
      description: Malformed request or invalid parameters
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: The page parameter must be a positive integer.
    Unauthorized:
      description: Missing or invalid authentication credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: A valid access token must be provided.
    Forbidden:
      description: Authenticated user is not authorised for this operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: You don't have permission to access this resource.
    NotFound:
      description: Resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: The requested resource was not found.
    UnprocessableEntity:
      description: Well-formed data that fails the validation rules
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            detail: There are validation errors.
            errors:
              - field: name
                message: The name must be at least 3 characters long.

  schemas:
    User:
      type: object
      description: Public representation of a user
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: integer
          minimum: 1
          readOnly: true
          example: 7
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Ana Silva
        email:
          type: string
          format: email
          example: ana.silva@example.org

    Project:
      type: object
      additionalProperties: false
      required: [id, name, description, ownerId, createdAt, updatedAt]
      properties:
        id:
          type: integer
          minimum: 1
          readOnly: true
          example: 12
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: Matriz
        description:
          type: string
          maxLength: 1000
          example: Project and task management application
        ownerId:
          type: integer
          minimum: 1
          readOnly: true
          description: Logical FK to User.id
          example: 7
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Task:
      type: object
      additionalProperties: false
      required: [id, projectId, title, description, status, priority, createdAt, updatedAt]
      properties:
        id:
          type: integer
          minimum: 1
          readOnly: true
          example: 35
        projectId:
          type: integer
          minimum: 1
          readOnly: true
          description: Logical FK to Project.id
          example: 12
        title:
          type: string
          minLength: 3
          maxLength: 150
          example: Create interface prototype
        description:
          type: string
          maxLength: 2000
          example: Prepare the main screens
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Comment:
      type: object
      additionalProperties: false
      required: [id, taskId, authorId, content, createdAt]
      properties:
        id:
          type: integer
          minimum: 1
          readOnly: true
        taskId:
          type: integer
          minimum: 1
          readOnly: true
          description: Logical FK to Task.id
        authorId:
          type: integer
          minimum: 1
          readOnly: true
          description: Logical FK to User.id
        content:
          type: string
          minLength: 1
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
          readOnly: true

    TaskAssignment:
      type: object
      description: Associative relationship between Task and User (logical composite key)
      additionalProperties: false
      required: [taskId, userId, assignedAt]
      properties:
        taskId:
          type: integer
          minimum: 1
          description: Part of the composite key; FK to Task.id
        userId:
          type: integer
          minimum: 1
          description: Part of the composite key; FK to User.id
        assignedAt:
          type: string
          format: date-time
          readOnly: true

    TaskStatus:
      type: string
      description: Task status
      enum: [TODO, IN_PROGRESS, DONE]
      example: TODO

    TaskPriority:
      type: string
      description: Task priority
      enum: [LOW, MEDIUM, HIGH]
      example: HIGH

    CreateProject:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          maxLength: 1000
          default: ''

    UpdateProject:
      type: object
      description: At least one field must be provided
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          maxLength: 1000

    CreateTask:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
        description:
          type: string
          maxLength: 2000
          default: ''
        status:
          allOf:
            - $ref: '#/components/schemas/TaskStatus'
          default: TODO
        priority:
          allOf:
            - $ref: '#/components/schemas/TaskPriority'
          default: MEDIUM

    UpdateTask:
      type: object
      description: At least one field must be provided
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
        description:
          type: string
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'

    CreateComment:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000

    PaginationMeta:
      type: object
      additionalProperties: false
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        totalItems:
          type: integer
          minimum: 0
          example: 42
        totalPages:
          type: integer
          minimum: 0
          example: 3

    ProjectList:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    TaskList:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    CommentList:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    TaskAssignmentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskAssignment'

    Problem:
      type: object
      description: Error format inspired by RFC 9457 (Problem Details)
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [field, message]
                properties:
                  field:
                    type: string
                    example: name
                  message:
                    type: string
                    example: The name must be at least 3 characters long.
